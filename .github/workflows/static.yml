name: Deploy Aura website to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare uploaded static release
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp -R about blog contact manufacturing products sampling-ordering shipping-export tactical-headwear images dist/
          cp index.html 404.html robots.txt CNAME cap.glb dist/
          cp assets/index-*.js assets/index-*.css dist/assets/
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('dist')
          urls = ET.Element('urlset', xmlns='http://www.sitemaps.org/schemas/sitemap/0.9')
          for page in sorted(root.rglob('index.html')):
              route = page.relative_to(root).as_posix().removesuffix('index.html')
              ET.SubElement(ET.SubElement(urls, 'url'), 'loc').text = 'https://auraglobalindustries.com/' + route
          assert len(urls) == 11, 'Incomplete static release'
          ET.ElementTree(urls).write(root / 'sitemap.xml', encoding='utf-8', xml_declaration=True)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
